
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: jatinpatil45
          outputs: |
            dist/github-snake.svg?color_snake=%2300E5FF&color_dots=%230D1117,%230E4429,%23006D32,%2326A641,%2339D353
            dist/github-snake-dark.svg?color_snake=%2300E5FF&color_dots=%230D1117,%230E4429,%23006D32,%2326A641,%2339D353

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
